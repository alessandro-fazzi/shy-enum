plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Minitest/MultipleAssertions:
  Enabled: false

# Example classes shared by the tests and by bin/console.
Style/OneClassPerFile:
  Exclude:
    - "test/support/**/*"

# The playground stops in IRB on purpose.
Lint/Debugger:
  Exclude:
    - "examples/**/*"

# The variables are only used inside IRB.
Lint/UselessAssignment:
  Exclude:
    - "bin/console"
    - "examples/**/*"
