# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

# Development gems from the Gemfile: ignoring a gem skips its dependencies too.
# minitest stays: activesupport depends on it. steep and simplecov are skipped
# anyway, as they are `require: false`.
gems:
  - name: irb
    ignore: true
  - name: minitest-reporters
    ignore: true
  - name: rake
    ignore: true
  - name: rdoc
    ignore: true
  - name: rubocop
    ignore: true
  - name: rubocop-minitest
    ignore: true
  - name: rubocop-rake
    ignore: true
  - name: sqlite3
    ignore: true
